<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英檢練習">
<link rel="apple-touch-icon" href="./app/icon.png">
<title>Kyro 英檢練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./app/style.css?v=4">
</head>
<body>
<div class="wrap">
<header class="top">
<p class="eyebrow">英檢組・全民英檢初級題型・小二版</p>
<h1>Kyro 英檢練習</h1>
<p class="lede">每天早上會有一份新的練習。做完到「成績」按「複製結果」，回覆當天的 Email 貼上。</p>
</header>
<div id="today"></div>
<h2 class="h3">之前的練習</h2>
<ul class="days" id="days"></ul>
<h2 class="h3">其他</h2>
<ul class="days"><li><a href="r1/"><span class="d-l"><span class="d-date">Kyro 英檢小挑戰 第 1 回</span><span class="d-focus">聽力 10、閱讀 10、寫作 4、口說選做</span></span><span class="state">挑戰</span></a></li></ul>
</div>
<script>
(function(){
var DAYS=[{"date":"2026-11-12","no":1,"focus":"今天的重點：天氣、數數量、Can you…?、Whose…?、看菜單找價錢、否定句加 not、用 but 連接。"},{"date":"2026-11-13","no":2,"focus":"今天的重點：看時鐘說半點、in/on/next to、Where…?、How old…?、公告找細節、問句把 is 放前面、用 or 連接。"},{"date":"2026-11-14","no":3,"focus":"今天的重點：聽標價的數字、看日曆說星期幾、Who…?、Do you…?、看行程表找時間和地點、can 問句、用 and 連接。"}];
var WD=["日","一","二","三","四","五","六"];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lab(d){var p=d.split("-"),x=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+"/"+(+p[2])+"（"+WD[x.getDay()]+"）";}
function state(d){try{var s=JSON.parse(localStorage.getItem("kyro-daily-"+d)||"null");if(!s)return["","還沒做"];if(s.done)return[" done","完成"];var n=Object.keys(s.mc||{}).length;return n?[" part","做了 "+n+" 題"]:["","還沒做"];}catch(e){return["","還沒做"];}}
var now=new Date(),t=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
var avail=DAYS.filter(function(d){return d.date<=t;});
var cur=avail.length?avail[avail.length-1]:DAYS[0];
var el=document.getElementById("today");
if(cur){var s=state(cur.date);el.innerHTML='<a class="today" href="days/'+cur.date+'/"><span class="t-date">第 '+cur.no+' 天・'+lab(cur.date)+'</span><span class="t-title">'+(cur.date===t?"今天的練習":"最新的練習")+'</span><span class="t-focus">'+esc(cur.focus)+'</span><span class="t-go">'+(s[0]===" done"?"再看一次":"開始練習")+' →</span></a>';}
else el.innerHTML='<p class="sec-intro">第一份練習還在準備中。</p>';
var list=avail.slice(0,-1).reverse();
document.getElementById("days").innerHTML=list.length?list.map(function(d){var s=state(d.date);return '<li><a href="days/'+d.date+'/"><span class="d-l"><span class="d-date">第 '+d.no+' 天・'+lab(d.date)+'</span><span class="d-focus">'+esc(d.focus)+'</span></span><span class="state'+s[0]+'">'+s[1]+'</span></a></li>';}).join(""):'<li class="sec-intro">還沒有。</li>';
})();
</script>
</body>
</html>
