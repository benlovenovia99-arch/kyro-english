  --pencil:#F4B400; --on-pencil:#1B2A4A; --graphite:#26324D;
  --ok:#1E8757; --ok-bg:#E2F3EA; --no:#C23F2B; --no-bg:#FBE8E4;
  --note:#FFF7D6; --note-rule:#E6D284; --pic-bg:#FFFFFF; --focus:#F4B400;
  --il-line:#2A3350; --il-ink:#1B2236; --il-white:#FFFFFF; --il-red:#E5533F; --il-green:#4FAF5E;
  --il-lime:#A6D98F; --il-yellow:#F6C431; --il-blue:#5A8DEE; --il-sky:#E3EEFF; --il-brown:#9A6A3F;
  --il-tan:#DDA56B; --il-orange:#F2994A; --il-grass:#BFE3A5;
  --f-read:"Andika","Trebuchet MS","Verdana",sans-serif;
  --f-ui:"Lexend","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --sheet:#172036; --ink:#E7EDF8; --ink-soft:#A3AEC6; --rule:#2B3856;
    --pencil:#F4B400; --on-pencil:#1B2A4A; --graphite:#E7EDF8;
    --ok:#4CC08A; --ok-bg:#12382A; --no:#F08872; --no-bg:#3D1F1A;
    --note:#2B2715; --note-rule:#5E5329; --pic-bg:#EDF1F7; --focus:#F4B400;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --sheet:#172036; --ink:#E7EDF8; --ink-soft:#A3AEC6; --rule:#2B3856;
  --pencil:#F4B400; --on-pencil:#1B2A4A; --graphite:#E7EDF8;
  --ok:#4CC08A; --ok-bg:#12382A; --no:#F08872; --no-bg:#3D1F1A;
  --note:#2B2715; --note-rule:#5E5329; --pic-bg:#EDF1F7; --focus:#F4B400;
  color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* header */
.top{display:grid;gap:8px;padding-bottom:14px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
h1{margin:0;font-weight:600;font-size:clamp(26px,6vw,36px);line-height:1.2;text-wrap:balance}
h1 .round{display:inline-block;font-size:.5em;font-weight:500;vertical-align:middle;margin-left:6px;padding:3px 10px;border:1.5px solid var(--ink);border-radius:999px}
.lede{margin:0;color:var(--ink-soft);max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.seg{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet)}
.seg-lab{font-size:13px;color:var(--ink-soft);padding:0 6px 0 8px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding-block:8px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px 6px;display:grid;gap:1px;justify-items:center;min-width:0}
.tab .tl{font-weight:600;font-size:15px;white-space:nowrap}
.tab .tc{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--sheet);box-shadow:inset 0 -3px 0 var(--pencil)}

/* sections & parts */
.sec{display:grid;gap:14px}
.sec-intro{margin:0;color:var(--ink-soft);font-size:15px}
.notice{margin:0;padding:12px 14px;border-radius:10px;background:var(--no-bg);color:var(--ink);font-size:15px}
.part-head{display:grid;gap:2px;margin-top:14px}
.part-no{margin:0;font-size:13px;letter-spacing:.08em;color:var(--ink-soft)}
.part-head h2{margin:0;font-size:22px;font-weight:600}
.part-desc{margin:0;color:var(--ink-soft);font-size:15px;max-width:62ch}

/* item card */
.item{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.item-top{display:flex;align-items:center;gap:10px}
.qno{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;min-width:30px;height:30px;padding:0 8px;border-radius:8px;background:var(--paper);display:inline-grid;place-items:center}
.pic{background:var(--pic-bg);border:1px solid var(--rule);border-radius:10px;display:flex;justify-content:center;padding:8px}
.pic svg{width:100%;max-width:340px;height:auto;display:block}

/* play */
.play-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.play{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--pencil);color:var(--on-pencil);font-weight:600;font-size:16px;padding:12px 20px;min-height:48px}
.play .ic{width:18px;height:18px;fill:currentColor}
.play:active{transform:scale(.97)}
.play.is-playing{box-shadow:0 0 0 4px color-mix(in srgb,var(--pencil) 35%,transparent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--pencil) 15%,transparent)}}
.plays{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:9px 16px;color:var(--ink);font-size:15px;min-height:42px}
.ghost.sm{font-size:14px;padding:7px 12px;min-height:38px;color:var(--ink-soft)}
.ghost:disabled{opacity:.5;cursor:default}
.btn{border:0;border-radius:999px;background:var(--graphite);color:var(--sheet);font-weight:600;padding:11px 20px;min-height:44px;font-size:15px}
.danger{border-color:var(--no);color:var(--no)}

/* options = answer-sheet bubbles */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;min-height:54px;font-family:var(--f-read);font-size:20px;line-height:1.35;color:var(--ink);min-width:0}
.opt .otext{min-width:0}
.bubble{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-ui);font-weight:600;font-size:15px;transition:background .15s}
.opt:not(:disabled):hover{border-color:var(--ink-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .bubble{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .bubble{background:var(--no);border-color:var(--no);color:var(--sheet)}
.opts.done .opt:not(.right):not(.wrong){opacity:.5}
.opt:disabled{cursor:default}
.opts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.pic-opt{flex-direction:column;align-items:center;padding:10px 8px;gap:8px}
.opt-pic{display:block;width:100%;background:var(--pic-bg);border-radius:8px}
.opt-pic svg{display:block;width:100%;height:auto}
.hush{font-family:var(--f-ui);font-size:15px;color:var(--ink-soft)}
.item.picaudio .real{display:none}
.item.picaudio.revealed .real{display:inline}
.item.picaudio.revealed .hush{display:none}

.fb{margin:0;font-size:15px;min-height:1.2em}
.fb:empty{display:none}
.fb.ok{color:var(--ok);font-weight:500}
.fb.no{color:var(--no);font-weight:500}
.fb .why{display:block;color:var(--ink-soft);font-weight:400;margin-top:2px}

.tx{font-size:15px}
.tx summary{cursor:pointer;color:var(--ink-soft)}
.script{display:grid;gap:4px;margin-top:8px;font-family:var(--f-read);font-size:17px}
.script p{margin:0}
.who{display:inline-block;min-width:3.4em;font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}

/* reading */
.stem{margin:0;font-family:var(--f-read);font-size:21px;line-height:1.5}
.stem.small{font-family:var(--f-ui);font-size:15px;color:var(--ink-soft)}
.gap{display:inline-block;width:3.2em;border-bottom:2.5px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.passage{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;font-family:var(--f-read);font-size:21px;line-height:1.75}
.blank{display:inline-block;min-width:3.6em;text-align:center;border-bottom:2.5px solid var(--ink);font-family:var(--f-ui);font-size:15px;font-weight:600;margin:0 3px}
.note{background:var(--note);border:1px solid var(--note-rule);border-radius:4px;padding:18px 20px;font-family:var(--f-read);font-size:20px;line-height:1.6;max-width:30em;justify-self:start;transform:rotate(-0.6deg)}
.note p{margin:0 0 8px}
.note .note-from{margin:12px 0 0;text-align:right}

/* writing */
.w-type{margin:0;font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
.w-instr{margin:-6px 0 0;font-weight:500}
.w-prompt{margin:0;font-family:var(--f-read);font-size:22px;line-height:1.5}
.w-prompt.big{font-size:23px;line-height:1.6}
.w-word{font-family:var(--f-ui);font-size:15px;color:var(--ink-soft)}
.w-input{width:100%;box-sizing:border-box;font-family:var(--f-read);font-size:21px;padding:11px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.w-input.ok{border-color:var(--ok);background:var(--ok-bg)}
.w-input.no{border-color:var(--no);background:var(--no-bg)}
.lines{display:grid;gap:10px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-read);font-size:21px}
.line .inl{flex:1 1 130px;width:auto;min-width:0}
.built{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed var(--rule);border-radius:12px}
.built-ph{color:var(--ink-soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-read);font-size:21px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);min-height:48px}
.chip.on{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hints{display:grid;gap:6px}
.hints:empty{display:none}
.hint{margin:0;padding:8px 12px;border-radius:10px;background:var(--paper);font-size:15px}
.hint span{font-weight:600;margin-right:8px}
.item.done{border-color:var(--ok)}

/* speaking */
.sp-text{margin:0;padding:10px 12px;border-radius:10px;background:var(--paper);font-family:var(--f-read);font-size:19px}
.muted{color:var(--ink-soft);font-family:var(--f-ui);font-size:14px}
.timer{font-weight:600;font-variant-numeric:tabular-nums;font-size:18px}
.mark{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px;border-top:1px dashed var(--rule)}
.mark-lab{font-size:14px;color:var(--ink-soft)}
.chipbtn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:15px;min-height:40px}
.chipbtn[aria-pressed="true"][data-v="good"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.chipbtn[aria-pressed="true"][data-v="again"]{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:600}

.next-row{display:flex;justify-content:flex-end;margin-top:8px}

/* results */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.tile .lab{font-size:14px;color:var(--ink-soft)}
.tile .big{font-size:38px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:18px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.tile .sub{font-size:13px;color:var(--ink-soft)}
.tile.key{border:2px solid var(--pencil)}
.h3{margin:14px 0 0;font-size:18px;font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--ink-soft);font-size:14px;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrong-list{margin:0;padding-left:20px;display:grid;gap:6px}
textarea{width:100%;box-sizing:border-box;font-family:var(--f-ui);font-size:15px;line-height:1.5;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);resize:vertical}
.copy-msg{font-size:14px;color:var(--ok)}
.reset-row{margin-top:10px}

/* parent key */
.parent{margin-top:40px;border:1.5px dashed var(--rule);border-radius:var(--r);background:var(--sheet)}
.parent>summary{padding:14px 16px;font-weight:600;cursor:pointer}
.parent-body{padding:0 16px 18px;display:grid;gap:10px;font-size:15px}
.parent-body h3{margin:14px 0 0;font-size:17px}
.parent-body ul,.parent-body ol{margin:0;padding-left:22px;display:grid;gap:6px}
.k-ans{margin:0;font-weight:600}
.k-why{margin:2px 0 0;color:var(--ink-soft)}
.parent .script{font-size:15px;margin-top:4px}

/* illustration palette */
.f-red{fill:var(--il-red)} .f-green{fill:var(--il-green)} .f-lime{fill:var(--il-lime)} .f-yellow{fill:var(--il-yellow)}
.f-blue{fill:var(--il-blue)} .f-sky{fill:var(--il-sky)} .f-brown{fill:var(--il-brown)} .f-tan{fill:var(--il-tan)}
.f-orange{fill:var(--il-orange)} .f-grass{fill:var(--il-grass)} .f-white{fill:var(--il-white)} .f-ink{fill:var(--il-ink)} .f-none{fill:none}
.s-line{stroke:var(--il-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.s-thin{stroke:var(--il-line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-hand{stroke:var(--il-ink);stroke-linecap:round}
.s-ray{stroke:var(--il-yellow);stroke-width:4;stroke-linecap:round}
.s-cattail{stroke:var(--il-orange);stroke-width:7;stroke-linecap:round;fill:none}
.s-dogtail{stroke:var(--il-tan);stroke-width:6;stroke-linecap:round;fill:none}
.s-band{stroke:var(--il-red);stroke-width:4;stroke-linecap:round;fill:none}
.clk-num{font:700 14px var(--f-read);fill:var(--il-ink);text-anchor:middle}
.tag-txt{font:700 23px var(--f-read);fill:var(--il-ink);text-anchor:middle}

@media (max-width:480px){
  .tab .tl{font-size:14px}
  .opt{font-size:19px}
  .opts.pics{gap:6px}
  .pic-opt{padding:8px 4px}
}
@media (prefers-reduced-motion:reduce){
  .play.is-playing{animation:none}
  .note{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">英檢組・全民英檢初級題型・小二入門版</p>
    <h1>Kyro 英檢小挑戰<span class="round">第 1 回</span></h1>
    <p class="lede">聽力 10 題、閱讀 10 題、寫作 4 題，口說選做。全部約 25 分鐘，可以分兩天做完。</p>
    <div class="tools">
      <div class="seg" role="group" aria-label="英文語速">
        <span class="seg-lab">語速</span>
        <button type="button" data-speed="normal" aria-pressed="true">一般</button>
        <button type="button" data-speed="slow" aria-pressed="false">慢一點</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="測驗部分" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="listen" id="tab-listen"><span class="tl">聽力</span><span class="tc" id="tc-listen">0/10</span></button>
    <button type="button" class="tab" role="tab" data-tab="read" id="tab-read"><span class="tl">閱讀</span><span class="tc" id="tc-read">0/10</span></button>
    <button type="button" class="tab" role="tab" data-tab="write" id="tab-write"><span class="tl">寫作</span><span class="tc" id="tc-write">0/4</span></button>
    <button type="button" class="tab" role="tab" data-tab="speak" id="tab-speak"><span class="tl">口說</span><span class="tc" id="tc-speak">選做</span></button>
    <button type="button" class="tab" role="tab" data-tab="result" id="tab-result"><span class="tl">成績</span><span class="tc" id="tc-result">—</span></button>
  </nav>

  <section class="sec" id="sec-listen" data-sec="listen" role="tabpanel" aria-labelledby="tab-listen"></section>
  <section class="sec" id="sec-read" data-sec="read" role="tabpanel" aria-labelledby="tab-read" hidden></section>
  <section class="sec" id="sec-write" data-sec="write" role="tabpanel" aria-labelledby="tab-write" hidden></section>
  <section class="sec" id="sec-speak" data-sec="speak" role="tabpanel" aria-labelledby="tab-speak" hidden></section>
  <section class="sec" id="sec-result" data-sec="result" role="tabpanel" aria-labelledby="tab-result" hidden></section>

  <details class="parent" id="parent">
    <summary>家長區：使用方式、聽稿與答案（請孩子先別打開）</summary>
    <div class="parent-body" id="parentBody"></div>
  </details>
</div>

<script>
(function(){
"use strict";
var LETTERS = "ABCD";
var NUMW = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
var CN = ["","一","二","三","四"];
var ROLE_LABEL = {n:"旁白", w:"女聲", m:"男聲", b:"Kyro", k:"Kane"};
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- pictures ---------- */
function clockSVG(h, m){
  var s = '<svg viewBox="0 0 200 150" role="img" aria-label="時鐘"><circle class="f-white s-line" style="stroke-width:5" cx="100" cy="75" r="62"/>';
  for (var k = 1; k <= 12; k++){
    var a = k * 30 * Math.PI / 180;
    var x = 100 + 47 * Math.sin(a), y = 75 - 47 * Math.cos(a) + 5;
    s += '<text class="clk-num" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + k + '</text>';
  }
  var ha = ((h % 12) + m / 60) * 30 * Math.PI / 180, ma = m * 6 * Math.PI / 180;
  s += '<line class="s-hand" style="stroke-width:7" x1="100" y1="75" x2="' + (100 + 26 * Math.sin(ha)).toFixed(1) + '" y2="' + (75 - 26 * Math.cos(ha)).toFixed(1) + '"/>';
  s += '<line class="s-hand" style="stroke-width:4" x1="100" y1="75" x2="' + (100 + 42 * Math.sin(ma)).toFixed(1) + '" y2="' + (75 - 42 * Math.cos(ma)).toFixed(1) + '"/>';
  s += '<circle class="f-ink" cx="100" cy="75" r="5"/></svg>';
  return s;
}
function sunRays(cx, cy){
  var s = "";
  for (var k = 0; k < 8; k++){
    var a = k * Math.PI / 4;
    s += '<line class="s-ray" x1="' + (cx + 20 * Math.cos(a)).toFixed(1) + '" y1="' + (cy + 20 * Math.sin(a)).toFixed(1) + '" x2="' + (cx + 28 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + 28 * Math.sin(a)).toFixed(1) + '"/>';
  }
  return s;
}
var CAT = '<path class="s-cattail" d="M32 6 C 50 2, 50 -16, 40 -24"/>' +
  '<ellipse class="f-orange s-line" cx="0" cy="19" rx="6" ry="4"/><ellipse class="f-orange s-line" cx="22" cy="19" rx="6" ry="4"/>' +
  '<ellipse class="f-orange s-line" cx="10" cy="6" rx="26" ry="14"/>' +
  '<polygon class="f-orange s-line" points="-26,-12 -24,-28 -15,-19"/><polygon class="f-orange s-line" points="-13,-19 -4,-28 -2,-12"/>' +
  '<circle class="f-orange s-line" cx="-14" cy="-6" r="14"/>' +
  '<circle class="f-ink" cx="-19" cy="-8" r="2"/><circle class="f-ink" cx="-9" cy="-8" r="2"/>' +
  '<path class="f-none s-thin" d="M-17 -1 Q-14 2 -11 -1"/>';

/* ---------- speech ---------- */
var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
var V = {f:null, m:null};
function loadVoices(){
  if (!synth) return;
  var all = [];
  try { all = synth.getVoices() || []; } catch(e){}
  var bad = /bubbles|bells|boing|bad news|good news|cellos|organ|trinoids|whisper|zarvox|jester|superstar|wobble|albert|hysterical|deranged|pipe|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
  var en = all.filter(function(v){ return /^en[-_]/i.test(v.lang) && !bad.test(v.name); });
  var us = en.filter(function(v){ return /US/i.test(v.lang); });
  var pool = us.length ? us : en;
  var fem = /samantha|ava|allison|susan|zoe|nicky|joelle|karen|zira|jenny|aria|female|google us english/i;
  var mal = /alex|fred|aaron|tom\b|evan|nathan|daniel|david|guy|\bmale\b|ralph/i;
  V.f = pool.find(function(v){ return fem.test(v.name); }) || pool.find(function(v){ return !mal.test(v.name); }) || pool[0] || null;
  V.m = pool.find(function(v){ return mal.test(v.name); }) || null;
}
if (synth){ loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch(e){} }
var ROLE = {
  n:{v:"f", p:1, r:1}, w:{v:"f", p:1.08, r:1},
  m:{v:"m", p:1, alt:0.72, r:0.97},
  b:{v:"f", p:1.4, r:1.02}, k:{v:"m", p:1.18, alt:1.22, r:1}
};
var curDone = null;
function speakLines(lines, onDone){
  if (!synth){ if (onDone) onDone(); return; }
  try { synth.cancel(); } catch(e){}
  if (curDone){ var prev = curDone; curDone = null; prev(); }
  var base = st.slow ? 0.72 : 0.88;
  var finished = false, tm = null, chars = 0;
  function finish(){
    if (finished) return; finished = true;
    if (curDone === finish) curDone = null;
    clearTimeout(tm);
    if (onDone) onDone();
  }
  curDone = finish;
  lines.forEach(function(ln, i){
    var R = ROLE[ln[0]] || ROLE.n, text = ln[1];
    chars += text.length;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    var voice = R.v === "m" ? (V.m || V.f) : V.f;
    if (voice) u.voice = voice;
    u.pitch = (R.v === "m" && !V.m) ? R.alt : R.p;
    u.rate = base * (R.r || 1);
    if (i === lines.length - 1){ u.onend = finish; u.onerror = finish; }
    synth.speak(u);
  });
  tm = setTimeout(finish, 2500 + chars * 95 / base);
}

/* ---------- writing ---------- */
function norm(t){ return String(t || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:"]/g, " ").replace(/\s+/g, " ").trim(); }
function checkSentence(w, raw){
  var v = norm(raw);
  if (!v) return {s:"empty", m:"先寫寫看，再按檢查。"};
  if (w.accept.indexOf(v) >= 0){
    var t = String(raw).trim(), cap = /^[A-Z]/.test(t), end = t.slice(-1);
    var p = w.needQ ? end === "?" : end === ".";
    if (cap && p) return {s:"ok", m:"完全正確！"};
    var tips = [];
    if (!cap) tips.push("第一個字母要大寫");
    if (!p) tips.push(w.needQ ? "句尾要加問號 ?" : "句尾要加句點 .");
    return {s:"almost", m:"句子寫對了！再注意：" + tips.join("、") + "。"};
  }
  if (w.near){ for (var k = 0; k < w.near.length; k++){ if (w.near[k][0].test(v)) return {s:"retry", m:w.near[k][1]}; } }
  return {s:"retry", m:"還差一點，再看一次題目，或按「提示」。"};
}
function renderChips(id){
  var w = ITEM[id], s = wr(id), used = {};
  s.chips.forEach(function(k){ used[k] = true; });
  $("#built-" + id).innerHTML = s.chips.length ? s.chips.map(function(k, pos){
    return '<button type="button" class="chip on" data-unchip="' + id + '" data-pos="' + pos + '">' + esc(w.words[k]) + '</button>';
  }).join("") : '<span class="built-ph">點下面的字卡，排成一句話</span>';
  $("#chips-" + id).innerHTML = w.words.map(function(t, k){
    return '<button type="button" class="chip" data-chip="' + id + '" data-k="' + k + '"' + (used[k] ? " hidden" : "") + '>' + esc(t) + '</button>';
  }).join("");
}
function applyWriting(id){
  var w = ITEM[id], s = wr(id);
  if (w.kind === "rewrite" || w.kind === "combine"){
    var inp = $("#in-" + id); if (inp && inp.value !== s.val) inp.value = s.val;
  }
  if (w.kind === "picture"){
    w.lines.forEach(function(ln, k){
      var el = $("#in-" + id + "-" + k); if (!el) return;
      var val = s.lines[k] || ""; if (el.value !== val) el.value = val;
      el.classList.remove("ok","no");
      if (s.lineRes){ if (s.lineRes[k] === "ok") el.classList.add("ok"); else if (s.lineRes[k] === "no" || s.lineRes[k] === "empty") el.classList.add("no"); }
    });
  }
  if (w.kind === "order") renderChips(id);
  $("#hints-" + id).innerHTML = w.hints.slice(0, s.hints).map(function(t, i){ return '<p class="hint"><span>提示 ' + (i + 1) + '</span>' + esc(t) + '</p>'; }).join("");
  var hb = $("#hintbtn-" + id), solved = s.status === "ok" || s.status === "almost";
  hb.textContent = s.hints >= w.hints.length ? "提示已用完" : "提示（" + s.hints + "/" + w.hints.length + "）";
  hb.disabled = s.hints >= w.hints.length || solved;
  var fb = $("#fb-" + id);
  fb.className = "fb" + (solved ? " ok" : s.status === "retry" ? " no" : "");
  fb.textContent = s.msg || "";
  $("#item-" + id).classList.toggle("done", solved);
}
function checkWriting(id){
  var w = ITEM[id], s = wr(id), res;
  if (w.kind === "rewrite" || w.kind === "combine") res = checkSentence(w, s.val);
  else if (w.kind === "order"){
    if (!s.chips.length) res = {s:"empty", m:"先點字卡排一排。"};
    else if (s.chips.length < w.words.length) res = {s:"retry", m:"還有字卡沒用到喔。"};
    else {
      var built = s.chips.map(function(k){ return w.words[k]; }).join(" ");
      res = built === w.ans ? {s:"ok", m:"完全正確！"} : {s:"retry", m:"字都用到了，順序再想想。"};
    }
  } else if (w.kind === "picture"){
    var lr = w.lines.map(function(ln, k){
      var v = norm(s.lines[k]);
      if (!v) return "empty";
      if (ln.accept.indexOf(v) >= 0) return "ok";
      return ln.free ? "parent" : "no";
    });
    s.lineRes = lr;
    if (lr.every(function(x){ return x === "empty"; })) res = {s:"empty", m:"先寫寫看，再按檢查。"};
    else {
      var bad = []; lr.forEach(function(x, k){ if (x === "no" || x === "empty") bad.push(k + 1); });
      if (bad.length) res = {s:"retry", m:"第 " + bad.join("、") + " 句再看看圖。"};
      else res = lr[2] === "parent" ? {s:"ok", m:"第 1、2 句都對！第 3 句請家長看看。"} : {s:"ok", m:"三句都寫好了！"};
    }
  }
  if (res.s === "empty"){ s.msg = res.m; s.status = null; }
  else { s.tries = (s.tries || 0) + 1; s.status = res.s; s.msg = res.m; }
  save(); applyWriting(id); updateTabs();
}
function addHint(id){ var w = ITEM[id], s = wr(id); s.hints = Math.min(w.hints.length, s.hints + 1); save(); applyWriting(id); }
function chipsChanged(id){ var s = wr(id); if (s.status === "retry"){ s.status = null; s.msg = ""; } save(); applyWriting(id); }
function addChip(id, k){ var s = wr(id); if (s.chips.indexOf(k) < 0) s.chips.push(k); chipsChanged(id); }
function removeChip(id, pos){ wr(id).chips.splice(pos, 1); chipsChanged(id); }
function clearChips(id){ wr(id).chips = []; chipsChanged(id); }

/* ---------- stats & results ---------- */
function allOf(groups){ var a = []; groups.forEach(function(p){ a = a.concat(p.items); }); return a; }
function computeStats(){
  var L = allOf(LISTEN), R = allOf(READ);
  var o = {L:{first:0, replay:0, wrong:0, left:0, wrongN:[]}, R:{right:0, wrong:0, left:0, wrongN:[]}, W:{done:0, hints:0, fmt:[], parent:false, left:0}, S:{good:0, again:0}};
  L.forEach(function(it){
    var r = st.mc[it.id];
    if (!r){ o.L.left++; return; }
    if (r.first === it.ans){ if (r.plays <= 1 && !r.hint) o.L.first++; else o.L.replay++; }
    else { o.L.wrong++; o.L.wrongN.push(it.n); }
  });
  R.forEach(function(it){
    var r = st.mc[it.id];
    if (!r){ o.R.left++; return; }
    if (r.first === it.ans) o.R.right++; else { o.R.wrong++; o.R.wrongN.push(it.n); }
  });
  WRITE.forEach(function(w){
    var s = wr(w.id);
    o.W.hints += s.hints;
    if (s.status === "ok" || s.status === "almost") o.W.done++; else o.W.left++;
    if (s.status === "almost") o.W.fmt.push(w.n);
    if (w.kind === "picture" && s.lineRes && s.lineRes[2] === "parent") o.W.parent = true;
  });
  SPEAK.forEach(function(s){ if (st.sp[s.id] === "good") o.S.good++; else if (st.sp[s.id] === "again") o.S.again++; });
  return o;
}
function summaryText(o){
  var d = new Date(), date = (d.getMonth() + 1) + "/" + d.getDate();

  t += "閱讀：答對 " + o.R.right + "/10" + (o.R.wrongN.length ? "，答錯第 " + o.R.wrongN.join("、") + " 題" : "") + (o.R.left ? "，未作答 " + o.R.left : "") + "\n";
  t += "寫作：完成 " + o.W.done + "/4，用了 " + o.W.hints + " 次提示" + (o.W.fmt.length ? "，第 " + o.W.fmt.join("、") + " 題大寫或標點要注意" : "") + (o.W.parent ? "，第 4 題第 3 句請家長確認" : "") + "\n";
  t += "口說（選做）：說得很好 " + o.S.good + "/4" + (o.S.again ? "，再練 " + o.S.again + " 題" : "");
  return t;
}
function renderResult(){
  var o = computeStats();
  var tile = function(lab, big, sub, key){ return '<div class="tile' + (key ? " key" : "") + '"><span class="lab">' + lab + '</span><span class="big">' + big + '</span><span class="sub">' + sub + '</span></div>'; };
  var h = '<div class="part-head"><p class="part-no">成績</p><h2>這一回的三個數字</h2><p class="part-desc">英檢組每天只記三個數字：聽力首聽答對幾題、閱讀答對幾題、寫作用了幾次提示。</p></div>';
  h += '<div class="tiles">' +
    tile("聽力・首聽答對", o.L.first + "<small>/10</small>", "重播或看文字後答對 " + o.L.replay + "・答錯 " + o.L.wrong + (o.L.left ? "・未作答 " + o.L.left : ""), true) +
    tile("閱讀・答對", o.R.right + "<small>/10</small>", o.R.left ? "未作答 " + o.R.left : "答錯 " + o.R.wrong, true) +
    tile("寫作・提示次數", o.W.hints + "<small>次</small>", "完成 " + o.W.done + "/4", true) +
    tile("口說・選做", o.S.good + "<small>/4</small>", "家長點選「說得很好」的題數", false) + '</div>';
  var rows = "";
  [["聽力", LISTEN], ["閱讀", READ]].forEach(function(g){
    g[1].forEach(function(p){
      var ans = 0, right = 0, bad = [];
      p.items.forEach(function(it){ var r = st.mc[it.id]; if (!r) return; ans++; if (r.first === it.ans) right++; else bad.push(it.n); });
      rows += '<tr><td>' + g[0] + '・' + p.title + '</td><td class="num">' + p.items.length + '</td><td class="num">' + (ans ? right + " / " + ans : "—") + '</td><td>' + (bad.length ? "第 " + bad.join("、") + " 題" : (ans ? "沒有" : "—")) + '</td></tr>';
    });
  });
  h += '<h3 class="h3">各題型表現</h3><div class="tbl-wrap"><table><thead><tr><th>題型</th><th>題數</th><th>第一次就選對</th><th>要再練</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  var wl = [];
  allOf(LISTEN).concat(allOf(READ)).forEach(function(it){
    var r = st.mc[it.id];
    if (r && r.first !== it.ans) wl.push('<li><b>' + (it.sec === "listen" ? "聽力" : "閱讀") + ' 第 ' + it.n + ' 題</b>：' + esc(it.why) + '</li>');
  });
  if (wl.length) h += '<h3 class="h3">第一次選錯的題目</h3><ul class="wrong-list">' + wl.join("") + '</ul>';
  h += '<h3 class="h3">把結果交給英檢組老師</h3><p class="part-desc">按下複製，貼到【英檢組】對話，我會依結果調整第 2 回的難度。</p>';
  h += '<textarea id="sumText" rows="6" readonly aria-label="結果文字">' + esc(summaryText(o)) + '</textarea>';
  h += '<div class="row"><button type="button" class="btn" id="copyBtn">複製結果</button><span class="copy-msg" id="copyMsg" aria-live="polite"></span></div>';
  h += '<div class="row reset-row"><button type="button" class="ghost" id="resetBtn">清除作答，重新做一次</button></div>';
  $("#sec-result").innerHTML = h;
}
function copySummary(){
  var ta = $("#sumText"), msg = $("#copyMsg"), txt = ta.value;
  var fallback = function(){ ta.focus(); ta.select(); try { ta.setSelectionRange(0, txt.length); } catch(e){} msg.textContent = "文字已選取，請按「拷貝」。"; };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ msg.textContent = "已複製，可以貼到英檢組對話。"; }).catch(fallback);
  } else fallback();
}
function resetAll(btn){
  if (!btn.dataset.armed){
    btn.dataset.armed = "1"; btn.textContent = "再按一次，確定清除"; btn.classList.add("danger");
    setTimeout(function(){ if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = "清除作答，重新做一次"; btn.classList.remove("danger"); } }, 4000);
    return;
  }
  st = fresh(st.slow); save();
  renderAll(); setTab("listen");
}

/* ---------- tabs ---------- */
function updateTabs(){
  var L = allOf(LISTEN).filter(function(it){ return st.mc[it.id]; }).length;
  var R = allOf(READ).filter(function(it){ return st.mc[it.id]; }).length;
  var W = WRITE.filter(function(w){ var s = wr(w.id); return s.status === "ok" || s.status === "almost"; }).length;
  var S = SPEAK.filter(function(s){ return st.sp[s.id]; }).length;
  $("#tc-listen").textContent = L + "/10";
  $("#tc-read").textContent = R + "/10";
  $("#tc-write").textContent = W + "/4";
  $("#tc-speak").textContent = S ? S + "/4" : "選做";
  $("#tc-result").textContent = (L === 10 && R === 10 && W === 4) ? "完成" : "—";
  if (st.tab === "result") renderResult();
}
function setTab(t){
  st.tab = t; save();
  document.querySelectorAll(".sec").forEach(function(s){ s.hidden = s.dataset.sec !== t; });
  document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"); });
  if (t === "result") renderResult();
  var nav = $("#tabs");
  if (nav && window.scrollY > nav.offsetTop) window.scrollTo(0, nav.offsetTop);
}
function setSpeed(v){
  st.slow = v === "slow"; save();
  document.querySelectorAll("[data-speed]").forEach(function(b){ b.setAttribute("aria-pressed", (b.dataset.speed === "slow") === st.slow ? "true" : "false"); });
}

/* ---------- parent key ---------- */
function renderParent(){
  var h = '<h3>怎麼用</h3><ul>' +
    '<li>建議分兩次：第一天做聽力和閱讀（約 15 分鐘），第二天做寫作和口說（約 10 分鐘）。</li>' +
    '<li>每題只算第一次的答案。答錯可以再選一次，當作訂正，不影響分數。</li>' +
    '<li>聽力可以重播，頁面會分開記「只聽一次就答對」和「重播或看文字後答對」。第一部分的「顯示選項文字」算一次提示。</li>' +
    '<li>聲音用的是 iPad 內建的英文語音。如果聲音太快，按上方「慢一點」。沒有聲音時，可以照下面的聽稿念給他聽。</li>' +
    '<li>做完到「成績」按「複製結果」，貼回【英檢組】對話。作答紀錄只存在這台裝置的瀏覽器裡。</li></ul>';
  h += '<h3>和正式初級的對照</h3><div class="tbl-wrap"><table><thead><tr><th>項目</th><th>正式全民英檢初級</th><th>本回小二版</th></tr></thead><tbody>' +
    '<tr><td>聽力</td><td>30 題、約 20 分鐘，每題只播一次</td><td>10 題，四種題型都有，可重播但記錄首聽</td></tr>' +
    '<tr><td>閱讀</td><td>30 題、35 分鐘（詞彙 10、段落填空 8、閱讀理解 12）</td><td>10 題，三種題型，短文約 40 字，只考細節和簡單代名詞</td></tr>' +
    '<tr><td>寫作</td><td>單句寫作，加上約 50 字的段落寫作</td><td>改寫、合併、重組各 1 題，看圖寫 3 句（都有開頭）</td></tr>' +
    '<tr><td>口說</td><td>複誦、朗讀、回答問題，約 10 分鐘</td><td>4 題選做，家長陪練，不計分</td></tr>' +
    '</tbody></table></div>';
  h += '<h3>聽力聽稿與答案</h3><ol>' + allOf(LISTEN).map(function(it){
    return '<li><p class="k-ans">答案 ' + LETTERS[it.ans] + (it.labels ? '（' + it.labels[it.ans] + '）' : '：' + esc(it.opts[it.ans])) + '</p>' + scriptHTML(it.script) + '<p class="k-why">' + esc(it.why) + '</p></li>';
  }).join("") + '</ol>';
  h += '<h3>閱讀答案</h3><ol>' + allOf(READ).map(function(it){
    return '<li><span class="k-ans">' + LETTERS[it.ans] + ' ' + esc(it.opts[it.ans]) + '</span>　<span class="k-why">' + esc(it.why) + '</span></li>';
  }).join("") + '</ol>';
  h += '<h3>寫作參考答案</h3><ol>' +
    '<li>Is Kane tall?</li><li>I like apples and bananas.</li><li>This is my red bag.</li>' +
    '<li>It is sunny today. / The dog is under the tree. / I can see a tree.（第 3 句寫圖中任何東西都可以）</li></ol>';
  h += '<h3>口說內容</h3><ol>' +
    '<li>複誦：I have a red pencil.</li><li>複誦：My brother likes to play basketball.</li>' +
    '<li>朗讀：' + esc(SPEAK[2].text) + '</li><li>回答：' + esc(SPEAK[3].q) + '　例：' + esc(SPEAK[3].sample) + '</li></ol>';
  h += '<h3>這回特別放進去的觀察點</h3><ul>' +
    '<li>聽力第 2 題：fifteen／fifty 的重音辨別，是初級聽力常見陷阱。</li>' +
    '<li>閱讀第 2 題：predator／prey 的方向，和學校 LA 單字連在一起。</li>' +
    '<li>閱讀第 10 題：Don\'t play games 是否定句，對應各科「先圈出題目要求」的習慣。</li>' +
    '<li>寫作第 1、2 題：大寫和句尾標點，和文法發音組的書桌檢核表一致。</li></ul>';
  $("#parentBody").innerHTML = h;
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  var d = t.dataset;
  if (d.play) return playListen(d.play);
  if (d.show) return showText(d.show);
  if (t.classList.contains("opt")) return choose(d.item, parseInt(d.i, 10));
  if (d.tab) return setTab(d.tab);
  if (d.wcheck) return checkWriting(d.wcheck);
  if (d.whint) return addHint(d.whint);
  if (d.chip) return addChip(d.chip, parseInt(d.k, 10));
  if (d.unchip) return removeChip(d.unchip, parseInt(d.pos, 10));
  if (d.wclear) return clearChips(d.wclear);
  if (d.spplay) return playSpeak(d.spplay);
  if (d.sptext) return toggleSpText(d.sptext);
  if (d.spmark) return markSpeak(d.spmark, d.v);
  if (d.speed) return setSpeed(d.speed);
  if (t.id === "copyBtn") return copySummary();
  if (t.id === "resetBtn") return resetAll(t);
});
document.addEventListener("input", function(e){
  var t = e.target, d = t.dataset;
  if (d.winput){
    var s = wr(d.winput); s.val = t.value;
    if (s.status === "retry"){ s.status = null; s.msg = ""; applyWriting(d.winput); }
    saveSoon();
  } else if (d.wline){
    var s2 = wr(d.wline); s2.lines[parseInt(d.k, 10)] = t.value;
    if (s2.status === "retry"){ s2.status = null; s2.msg = ""; s2.lineRes = null; applyWriting(d.wline); }
    saveSoon();
  }
});
document.addEventListener("keydown", function(e){
  var t = e.target;
  if (e.key === "Enter" && t.classList && t.classList.contains("w-input")){
    e.preventDefault();
    checkWriting(t.dataset.winput || t.dataset.wline);
  }
});

function renderAll(){
  renderListen(); renderRead(); renderWrite(); renderSpeak();
  Object.keys(ITEM).forEach(function(id){
    var it = ITEM[id];
    if (it.sec === "listen" || it.sec === "read"){
      applyMC(id);
      if (it.sec === "listen"){ updatePlays(id); if (st.shown[id]) reveal(id); }
    } else if (it.sec === "write") applyWriting(id);
    else if (it.sec === "speak") applySpeak(id);
  });
  updateTabs();
}
renderParent();
renderAll();
setSpeed(st.slow ? "slow" : "normal");
setTab(st.tab || "listen");
})();
</script>
</body>
</html>
