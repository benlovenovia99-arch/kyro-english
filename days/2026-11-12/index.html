<script>window.DAY = {"date":"2026-11-12","no":1,"focus":"今天的重點：天氣、數數量、Can you…?、Whose…?、看菜單找價錢、否定句加 not、用 but 連接。","notes":["聽力第 4 題：Can you…? 要用 Yes, I can／No, I can't 回答，不是 Yes, I am。","閱讀第 2 題：habitat 是學校 LA 第 2 單元的單字。","寫作第 1、2 題：否定句 not 和連接詞 but，是今天新換的句型。"],"listen":[{"kind":"picaudio","pic":{"type":"weather","w":"rainy"},"q":"What's the weather like?","opts":["It's sunny.","It's rainy.","It's windy."],"ans":1,"why":"圖上有雲和雨滴，是下雨天：rainy。"},{"kind":"picaudio","pic":{"type":"count","obj":"bird","color":"blue","n":4},"q":"How many birds are there?","opts":["There are three birds.","There are five birds.","There are four birds."],"ans":2,"why":"數一數，圖上有 4 隻鳥：four birds。"},{"kind":"audioq","talk":[["w","What color is your new bike?"]],"opts":["It's red.","It's big.","Yes, it is."],"ans":0,"why":"What color 問顏色，要回答顏色：red。"},{"kind":"audioq","talk":[["m","Can you swim, Kyro?"]],"opts":["No, I can't.","Yes, I am.","I like fish."],"ans":0,"why":"用 Can you 問，就用 I can 或 I can't 回答。"},{"kind":"dialog","talk":[["g","Hi, Kyro. Is this your pencil?"],["b","No, it's Kane's pencil. My pencil is blue."]],"q":"Whose pencil is it?","opts":["Kyro's.","Mom's.","Kane's."],"ans":2,"why":"Kyro 說 No, it's Kane's pencil：是 Kane 的鉛筆。"},{"kind":"dialog","talk":[["w","Kyro, what do you want for breakfast?"],["b","Eggs and milk, please."],["w","OK. Here you are."]],"q":"What does Kyro want for breakfast?","opts":["Eggs and milk.","Bread and juice.","Rice and fish."],"ans":0,"why":"Kyro 說 Eggs and milk, please。"},{"kind":"picopts","talk":[["m","Good morning, everyone. Today is cold and very windy. Please wear a hat and a coat. Don't bring an umbrella. It is not rainy today."]],"q":"What is the weather like today?","pics":[{"type":"weather","w":"sunny"},{"type":"weather","w":"windy"},{"type":"weather","w":"rainy"}],"labels":["晴天","颳風","下雨"],"ans":1,"why":"老師說 Today is cold and very windy，又說 It is not rainy today。"},{"kind":"picopts","talk":[["b","Look! I have a cake for Mom. It is her birthday today. The cake is small and pink. There is one big candle on it."]],"q":"What does Kyro have for Mom?","pics":[{"type":"object","obj":"book","color":"green"},{"type":"object","obj":"flower","color":"pink"},{"type":"object","obj":"cake"}],"labels":["書","花","蛋糕"],"ans":2,"why":"Kyro 說 I have a cake for Mom，粉紅色的小蛋糕，上面有一根蠟燭。"}],"read":{"vocab":[{"stem":"I am thirsty. I want some ____.","opts":["water","bread","rice","shoes"],"ans":0,"why":"thirsty 是口渴，要喝水：water。"},{"stem":"A bird lives in a tree. The tree is its ____.","opts":["school","habitat","teacher","hospital"],"ans":1,"why":"動物住的地方叫 habitat（棲息地），是學校 LA 的單字。"},{"stem":"Kane and Kyro ____ brothers.","opts":["is","am","be","are"],"ans":3,"why":"Kane and Kyro 是兩個人，用 are。"}],"cloze":{"passage":"Today is Saturday. I go to the library {1} Dad. The library is big and quiet. I read three books about animals. My favorite book is about {2} frog. It can jump very high! It is fun.","items":[{"opts":["with","and","on","at"],"ans":0,"why":"「和爸爸一起」去圖書館：with Dad。"},{"opts":["an","a","two","they"],"ans":1,"why":"frog 是一隻，開頭是子音，用 a frog。"}]},"text":{"genre":"menu","intro":"讀下面的菜單，回答三個問題。","title":"Sunny Cafe","rows":[["Apple juice","$30"],["Milk","$25"],["Egg sandwich","$45"],["Banana cake","$50"]],"lines":["Open: 7:00 a.m. to 2:00 p.m."],"items":[{"stem":"How much is the milk?","opts":["$25.","$30.","$45.","$50."],"ans":0,"why":"菜單上 Milk 是 $25。"},{"stem":"What can you eat at Sunny Cafe?","opts":["Pizza.","An egg sandwich.","Ice cream.","A hot dog."],"ans":1,"why":"菜單上有 Egg sandwich，其他三個都沒有。"},{"stem":"When does Sunny Cafe open?","opts":["At 2:00.","At 5:00.","At 7:00.","At 9:00."],"ans":2,"why":"Open: 7:00 a.m.，早上 7 點開門。"}]}},"write":[{"kind":"rewrite","instr":"把句子改成否定句（加 not）。","prompt":"Kyro is sleepy.","needQ":false,"accept":["kyro is not sleepy","kyro isn't sleepy"],"model":"Kyro is not sleepy.","near":[["^kyro is sleepy$","要加 not 才是否定句。"],["^kyro not","not 要放在 is 的後面。"]],"hints":["否定句要在 is 的後面加 not。","Kyro is ___ sleepy."]},{"kind":"combine","instr":"用 but 把兩句合成一句。","prompt":["I like cats.","I don't like dogs."],"word":"but","needQ":false,"accept":["i like cats but i don't like dogs","i like cats but i do not like dogs"],"model":"I like cats, but I don't like dogs.","near":[["and i don't like dogs","前後意思相反，要用 but，不是 and。"],["^i like cats i don't like dogs$","中間要加 but。"]],"hints":["用 but 把兩句連起來，第一句的句點改成逗號。","I like cats, but I ___ like dogs."]},{"kind":"order","instr":"依照順序點字卡，排成一句話。","words":["can","fast.","Kane","swim"],"ans":"Kane can swim fast.","hints":["大寫字母開頭的字放第一個，有句點的字放最後。","Kane can ..."]},{"kind":"picture","instr":"看三張圖，把句子寫完。","panels":[{"type":"clock","h":7,"m":0},{"type":"position","obj":"ball","color":"red","rel":"under","ref":"chair"},{"type":"count","obj":"apple","n":3}],"lines":[{"pre":"It is","post":"o'clock.","accept":["seven"],"model":"seven"},{"pre":"The ball is","post":"the chair.","accept":["under"],"model":"under"},{"pre":"I have","post":"apples.","accept":["three"],"model":"three"}],"hints":["看時鐘：短針指著 7，長針指著 12。","球在椅子下面用 under；數一數蘋果有幾個。"]}]};</script>
