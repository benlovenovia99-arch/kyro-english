<script>window.DAY = {"date":"2026-11-15","no":4,"focus":"今天的重點：認物品和顏色、看天氣、How many…?、Are you…?、讀邀請卡找時間和地點、can't 否定句、用 but 連接。","notes":["聽力第 3、4 題：How many 要回答數量；Are you…? 用 Yes, I am. 或 No, I'm not. 回答，可以請 Kyro 自己再問一次。","閱讀第 3 題練 I am；段落填空練第三人稱 has（Lucky has），不是 have。","寫作第 1 題：can 的否定是 can't（cannot），後面的動詞不變；第 2 題 but 前面加逗號。"],"listen":[{"kind":"picaudio","pic":{"type":"object","obj":"umbrella","color":"yellow"},"q":"What is this?","opts":["It's a yellow hat.","It's a yellow umbrella.","It's a blue umbrella."],"ans":1,"why":"圖上是一把黃色的雨傘：a yellow umbrella。hat 是帽子，blue 是藍色。"},{"kind":"picaudio","pic":{"type":"weather","w":"cloudy"},"q":"How is the weather today?","opts":["It's sunny.","It's rainy.","It's cloudy."],"ans":2,"why":"圖上是灰灰的雲，沒有太陽也沒有下雨：cloudy（多雲）。"},{"kind":"audioq","talk":[["m","How many books do you have, Kyro?"]],"opts":["I have six books.","They are red.","Yes, I am."],"ans":0,"why":"How many 問有幾個，要回答數量：I have six books（我有六本書）。"},{"kind":"audioq","talk":[["w","Are you hungry, Kyro?"]],"opts":["It is a cake.","Yes, I am.","I can swim."],"ans":1,"why":"Are you…? 的問句，用 Yes, I am. 或 No, I'm not. 回答。"},{"kind":"dialog","talk":[["g","Kyro, do you play basketball?"],["b","No, I don't. I play soccer with Kane."],["g","That sounds fun!"]],"q":"What does Kyro play?","opts":["Basketball.","Baseball.","Soccer."],"ans":2,"why":"Kyro 說不打籃球，I play soccer：他踢足球。"},{"kind":"dialog","talk":[["w","Kane, how do you go to school?"],["k","I take the bus. Dad takes Kyro by car."]],"q":"How does Kane go to school?","opts":["By bus.","By car.","By bike."],"ans":0,"why":"Kane 說 I take the bus：他搭公車。坐汽車的是 Kyro。"},{"kind":"picopts","talk":[["w","Hello, everyone. The school zoo trip is on Monday. Please bring a hat and a bottle of water. Do not bring toys. We will see birds, fish, and frogs."]],"q":"What do the children need to bring?","pics":[{"type":"object","obj":"umbrella","color":"blue"},{"type":"object","obj":"ball","color":"red"},{"type":"object","obj":"hat","color":"green"}],"labels":["雨傘","球","帽子"],"ans":2,"why":"公告說 Please bring a hat and a bottle of water：要帶帽子和水。玩具（球）不要帶。"},{"kind":"picopts","talk":[["g","Hi, Kyro. This is Amy. Can you come to my house on Sunday? We can play with my new cat. She is white and very soft. Call me, please."]],"q":"What can Kyro play with at Amy's house?","pics":[{"type":"object","obj":"dog","color":"brown"},{"type":"object","obj":"cat","color":"white"},{"type":"object","obj":"fish","color":"orange"}],"labels":["狗","貓","魚"],"ans":1,"why":"Amy 在電話留言說 We can play with my new cat：可以和她的新貓咪玩，貓是白色的。"}],"read":{"vocab":[{"stem":"It is very cold today. Please put on your ____.","opts":["cup","coat","egg","bed"],"ans":1,"why":"天氣很冷，要穿上外套：coat。"},{"stem":"We read and borrow books at the ____.","opts":["hospital","park","pool","library"],"ans":3,"why":"可以看書、借書的地方是圖書館：library，是學校 LA 的單字。"},{"stem":"I ____ a student at Sunny School.","opts":["am","is","are","be"],"ans":0,"why":"主詞是 I，be 動詞要用 am：I am。"}],"cloze":{"passage":"Dear Tom, Thank you for the card. I like it very much. My dog Lucky {1} a new ball. It is blue and small. Lucky likes to run {2} the garden. Please come and see us! Your friend, Kyro","items":[{"opts":["have","is","has","are"],"ans":2,"why":"Lucky 是一隻狗（他、牠），「有」要用 has：Lucky has a new ball。"},{"opts":["of","in","to","an"],"ans":1,"why":"在花園裡跑：run in the garden。"}]},"text":{"genre":"card","intro":"讀下面的邀請卡，回答三個問題。","title":"Birthday Party!","lines":["Dear Kyro,","Please come to my birthday party!","Day: Saturday, November 21","Time: 2:00 to 4:00","Place: My house, 5 Park Road","We will eat cake and play games."],"signoff":"Your friend,","from":"Tom","items":[{"stem":"What time does the party start?","opts":["At 4:00.","At 2:00.","At 5:00.","At 12:00."],"ans":1,"why":"卡片寫 Time: 2:00 to 4:00，派對兩點開始、四點結束。"},{"stem":"Where is the party?","opts":["At school.","At the park.","At Tom's house.","At the zoo."],"ans":2,"why":"卡片寫 Place: My house，是寫卡片的 Tom 的家。Park Road 是路名，不是公園。"},{"stem":"What will they eat at the party?","opts":["Pizza.","Apples.","Noodles.","Cake."],"ans":3,"why":"卡片最後寫 We will eat cake：他們會吃蛋糕。"}]}},"write":[{"kind":"rewrite","instr":"把句子改成否定句（在 can 後面加 not，可以寫 can't）。","prompt":"Tom can play the piano.","needQ":false,"accept":["tom can't play the piano","tom cannot play the piano","tom can not play the piano"],"model":"Tom can't play the piano.","near":[["not can","not 要放在 can 的後面：can't 或 cannot。"],["plays","can 後面的動詞不加 s：play。"],["^tom can play the piano$","否定句要加 not：Tom can't play the piano."]],"hints":["在 can 後面加 not，也可以寫成 can't。","Tom can't ___ the piano."]},{"kind":"combine","instr":"用 but 把兩句合成一句。","prompt":["Kane is tall.","Kyro is short."],"word":"but","needQ":false,"accept":["kane is tall but kyro is short"],"model":"Kane is tall, but Kyro is short.","near":[["and","高和矮意思相反，要用 but，不是 and。"],["^kane is tall but is short$","後面要說是誰矮：but Kyro is short。"]],"hints":["兩句意思相反，中間用 but，前面加逗號。","Kane is tall, ___ Kyro is short."]},{"kind":"order","instr":"依照順序點字卡，排成一句話。","words":["your","bag?","Is","red","this"],"ans":"Is this your red bag?","hints":["大寫字母開頭的字放第一個，有問號的字放最後。","Is this ..."]},{"kind":"picture","instr":"看三張圖，把句子寫完。","panels":[{"type":"weather","w":"rainy"},{"type":"price","obj":"pencil","color":"yellow","amount":15},{"type":"position","obj":"frog","color":"green","rel":"on","ref":"box"}],"lines":[{"pre":"It is","post":"today.","accept":["rainy"],"model":"rainy"},{"pre":"The pencil is","post":"dollars.","accept":["fifteen","15"],"model":"fifteen"},{"pre":"The frog is","post":"the box.","accept":["on"],"model":"on"}],"hints":["第一張在下雨：rainy；鉛筆標價 15 元：fifteen。","青蛙在箱子的上面：on。"]}]};</script>
