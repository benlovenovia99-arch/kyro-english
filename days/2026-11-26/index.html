<script>window.DAY = {"date":"2026-11-26","no":15,"focus":"今天的重點：聽物品名稱、數星星（seven）、Who…?、Do you…?、聽購物和家人對話、聽公告和自我介紹找細節、讀餐廳菜單找價錢、be 動詞否定句、用 and 連接。","notes":["聽力第 3 題：Who 問「誰」，要回答人：My dad does. 可以在家問 Kyro：Who washes the dishes? 讓他用 ___ does. 回答。","閱讀第 6 題：forty（40）和 fourteen（14）聽起來、看起來都很像，-ty 是幾十、-teen 是十幾。可以寫 14 和 40 讓 Kyro 念念看。","寫作第 1 題：is 的否定句，直接在 is 後面加 not（或寫 isn't），不用 don't 或 doesn't。"],"listen":[{"kind":"picaudio","pic":{"type":"object","obj":"bottle","color":"blue"},"q":"What is in this picture, Kyro?","opts":["It's a blue cup.","It's a blue bottle.","It's a blue box."],"ans":1,"why":"圖上是一個藍色的瓶子：bottle。cup 是杯子，box 是盒子。"},{"kind":"picaudio","pic":{"type":"count","obj":"star","color":"yellow","n":7},"q":"How many yellow stars can you see?","opts":["I can see five stars.","I can see six stars.","I can see seven stars."],"ans":2,"why":"數一數，一共有 7 顆黃色星星：seven。five 是 5，six 是 6。"},{"kind":"audioq","talk":[["w","Who cooks dinner at your home, Kyro?"]],"opts":["At six.","It's rice.","My dad does."],"ans":2,"why":"Who 問「誰」，要回答一個人：My dad does（我爸爸煮）。At six 是時間，It's rice 是食物。"},{"kind":"audioq","talk":[["m","Do you like rainy days, Kyro?"]],"opts":["No, I don't.","It's cloudy.","Yes, he does."],"ans":0,"why":"Do you…? 要用 Yes, I do. 或 No, I don't. 回答。Yes, he does 是在說別人，不是「你」。"},{"kind":"dialog","talk":[["w","Kyro, do you want the blue cap or the green cap?"],["b","The green one, Mom. Green is my favorite color."],["w","OK. It is ten dollars."]],"q":"Which cap does Kyro want?","opts":["The green cap.","The blue cap.","The red cap."],"ans":0,"why":"Kyro 說 The green one：他要綠色的帽子，因為綠色是他最喜歡的顏色。"},{"kind":"dialog","talk":[["k","Kyro, where is Dad? I can't find him."],["b","He is in the garden. He is watering the flowers."]],"q":"Where is Dad?","opts":["In the kitchen.","In the garden.","In the car."],"ans":1,"why":"Kyro 說 He is in the garden：爸爸在花園裡澆花。"},{"kind":"picopts","talk":[["m","Hello, children. The park has a pet day on Saturday. You can bring your dog or cat. Please do not bring a fish. Bring some water, too. Thank you!"]],"q":"Which pet can't come to the park?","pics":[{"type":"object","obj":"fish","color":"orange"},{"type":"object","obj":"dog","color":"brown"},{"type":"object","obj":"cat","color":"gray"}],"labels":["魚","狗","貓"],"ans":0,"why":"公告說 Please do not bring a fish：不要帶魚。狗和貓都可以帶。"},{"kind":"picopts","talk":[["g","Hi, I am Amy. I am eight years old. I live next to Kyro. I have a pet bird. It is green. My favorite food is bananas. I eat one every day."]],"q":"What is Amy's favorite food?","pics":[{"type":"object","obj":"apple","color":"red"},{"type":"object","obj":"cake","color":"pink"},{"type":"object","obj":"banana","color":"yellow"}],"labels":["蘋果","蛋糕","香蕉"],"ans":2,"why":"Amy 說 My favorite food is bananas：她最喜歡香蕉，每天吃一根。"}],"read":{"vocab":[{"stem":"I am hungry. Can I have a ____, Mom?","opts":["chair","kite","sandwich","pencil"],"ans":2,"why":"肚子餓了要吃東西：sandwich（三明治）。chair 是椅子，kite 是風箏，都不能吃。"},{"stem":"Ms. Wang works at the hospital. She takes care of sick people. She is a ____.","opts":["cook","nurse","driver","singer"],"ans":1,"why":"在醫院照顧生病的人：nurse（護理師），是學校 LA 的單字。cook 是廚師。"},{"stem":"My sister ____ milk every morning.","opts":["drink","drinking","are","drinks"],"ans":3,"why":"My sister 是一個人（她），動詞要加 s：drinks。"}],"cloze":{"passage":"Thursday, November 26. Today is a cold day. I wear my blue coat {1} school. In art class, I draw a big snowman. My teacher likes it very much. After school, Kane and I {2} hot soup at home. It is yummy!","items":[{"opts":["to","at","on","of"],"ans":0,"why":"穿外套「去」學校：to school。"},{"opts":["has","have","is","am"],"ans":1,"why":"Kane and I 是兩個人（我們），要用 have：Kane and I have hot soup。"}]},"text":{"genre":"menu","intro":"讀下面小熊餐廳的菜單，回答三個問題。","title":"Happy Bear Café","lines":["Noodles: 60 dollars","Fried rice: 70 dollars","Hot dog: 40 dollars","Milk tea: 30 dollars","Apple juice: 25 dollars","Open every day: 11:00 to 8:00"],"items":[{"stem":"How much is the hot dog?","opts":["Fourteen dollars.","Forty dollars.","Four dollars.","Forty-four dollars."],"ans":1,"why":"Hot dog: 40 dollars：熱狗 40 元，forty。fourteen 是 14。"},{"stem":"Which drink is twenty-five dollars?","opts":["Milk tea.","Hot milk.","Water.","Apple juice."],"ans":3,"why":"Apple juice: 25 dollars：蘋果汁 25 元。Milk tea 是 30 元。"},{"stem":"What time does the café open?","opts":["At eight.","At ten.","At eleven.","At seven."],"ans":2,"why":"Open every day: 11:00 to 8:00：早上 11 點開門，eleven。8 點是關門的時間。"}]}},"write":[{"kind":"rewrite","instr":"改成否定句（不是⋯⋯）。","prompt":"The bus is yellow.","needQ":false,"accept":["the bus is not yellow","the bus isn't yellow"],"model":"The bus isn't yellow.","near":[["^the bus is yellow$","否定句要在 is 後面加 not：is not 或 isn't。"],["(don't|doesn't)","有 is 的句子，否定直接說 isn't，不用 don't 或 doesn't。"],["^the bus not","is 不能不見：The bus is not yellow。"]],"hints":["在 is 後面加 not，也可以寫成 isn't。","The bus ___ yellow."]},{"kind":"combine","instr":"用 and 把兩個句子合成一句。","prompt":["Amy can sing.","Amy can dance."],"word":"and","needQ":false,"accept":["amy can sing and dance","amy can sing and amy can dance","amy can sing and she can dance"],"model":"Amy can sing and dance.","near":[["\\bor\\b","兩件事都會，用 and，不是 or。"],["\\bbut\\b","兩件事都會，用 and，不是 but。"],["^amy can sing dance$","sing 和 dance 中間要加 and。"],["sings|dances","can 後面的動詞不加 s。"]],"hints":["兩句都是 Amy can，只要說一次 Amy can。","Amy can sing ___ dance."]},{"kind":"order","instr":"依照順序點字卡，排成一句話。","words":["tree.","sings","The","in","bird","the"],"ans":"The bird sings in the tree.","hints":["大寫字母開頭的字放第一個，有句點的字放最後。","The bird ..."]},{"kind":"picture","instr":"看三張圖，把句子寫完。","panels":[{"type":"calendar","mon":"NOV","day":26,"wd":"THURSDAY"},{"type":"position","obj":"cat","color":"black","rel":"under","ref":"chair"},{"type":"count","obj":"egg","color":"brown","n":5}],"lines":[{"pre":"Today is","post":".","accept":["thursday"],"model":"Thursday"},{"pre":"The black cat is","post":"the chair.","accept":["under"],"model":"under"},{"pre":"There are","post":"eggs.","accept":["five","5"],"model":"five"}],"hints":["看日曆上的星期：THURSDAY；貓在椅子的下面。","數一數有幾顆蛋：five。"]}]};</script>
