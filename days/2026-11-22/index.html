ype":"object","obj":"house","color":"blue"},{"type":"object","obj":"car","color":"red"},{"type":"object","obj":"tree","color":"green"}],"labels":["房子","車子","樹"],"ans":2,"why":"老師說 Today we draw a big tree：今天要畫一棵大樹。"},{"kind":"picopts","talk":[["b","This is my favorite thing. It is red. I wear it on my head. It keeps the sun off my face. I wear it in the park."]],"q":"What is Kyro's favorite thing?","pics":[{"type":"object","obj":"bag","color":"red"},{"type":"object","obj":"hat","color":"red"},{"type":"object","obj":"ball","color":"red"}],"labels":["包包","帽子","球"],"ans":1,"why":"Kyro 說 I wear it on my head（戴在頭上），還可以擋太陽：是一頂帽子。"}],"read":{"vocab":[{"stem":"It is very cold today. Please wear your ____.","opts":["fish","lunch","coat","bed"],"ans":2,"why":"天氣很冷，要穿外套：coat。"},{"stem":"Ants and bees are small ____.","opts":["insects","birds","cities","doctors"],"ans":0,"why":"螞蟻和蜜蜂都是小小的昆蟲：insects，是學校 LA 的單字。"},{"stem":"Kyro eats ____ egg every morning.","opts":["a","an","two","many"],"ans":1,"why":"egg 是母音 e 開頭，前面用 an：an egg。two 和 many 後面要接複數 eggs。"}],"cloze":{"passage":"Tom is a little frog. He lives in a pond. Every day he {1} high. One day he sees a big bird. Tom goes under a leaf. The bird cannot see {2}. Now Tom is safe!","items":[{"opts":["jump","jumping","to jump","jumps"],"ans":3,"why":"he（他）是一個，每天做的事，動詞要加 s：he jumps。"},{"opts":["he","him","his","they"],"ans":1,"why":"放在 see 後面當「看見誰」，要用 him，不是 he。"}]},"text":{"genre":"message","intro":"讀下面媽媽留給 Kyro 的留言，回答三個問題。","title":"A Message from Mom","lines":["Kyro,","I am at the shop now.","Your lunch is on the table.","Please feed the cat at twelve.","Kane comes home at three.","Love, Mom"],"items":[{"stem":"Where is Mom when she writes the message?","opts":["At school.","At the shop.","At the park.","At home."],"ans":1,"why":"留言第二行：I am at the shop now，媽媽在商店。"},{"stem":"Where is Kyro's lunch?","opts":["In the bag.","Under the bed.","In the box.","On the table."],"ans":3,"why":"Your lunch is on the table：午餐在桌子上。"},{"stem":"What does Mom want Kyro to do at twelve?","opts":["Feed the cat.","Call Dad.","Read a book.","Go to the park."],"ans":0,"why":"Please feed the cat at twelve：十二點要餵貓。"}]}},"write":[{"kind":"rewrite","instr":"改成否定句（不會⋯⋯）。","prompt":"The cat can swim.","needQ":false,"accept":["the cat can't swim","the cat cannot swim","the cat can not swim"],"model":"The cat can't swim.","near":[["^the cat can swim$","否定句要在 can 後面加 not：can't 或 cannot。"],["(don't|doesn't)","有 can 的句子，否定直接說 can't，不用 don't 或 doesn't。"],["(can't|cannot|can not) swims","can 後面的動詞不加 s：swim。"]],"hints":["在 can 後面加 not，可以寫成 can't。","The cat ___ swim."]},{"kind":"combine","instr":"用 or 把兩個問句合成一句。","prompt":["Is your cat black?","Is your cat white?"],"word":"or","needQ":true,"accept":["is your cat black or white","is your cat black or is it white","is your cat black or is your cat white"],"model":"Is your cat black or white?","near":[["\\band\\b","要問「選哪一個」，用 or，不是 and。"],["^is your cat black white$","兩個顏色中間要加 or。"],["^your cat is","這是問句，Is 要放在最前面。"]],"hints":["兩個問句只有顏色不一樣，用 or 把顏色連起來。","Is your cat black ___ white?"]},{"kind":"order","instr":"依照順序點字卡，排成一句話。","words":["six.","cooks","Mom","at","dinner"],"ans":"Mom cooks dinner at six.","hints":["大寫字母開頭的字放第一個，有句點的字放最後。","Mom cooks ..."]},{"kind":"picture","instr":"看三張圖，把句子寫完。","panels":[{"type":"calendar","mon":"NOV","day":22,"wd":"SUNDAY"},{"type":"count","obj":"bird","color":"blue","n":4},{"type":"object","obj":"cup","color":"yellow"}],"lines":[{"pre":"Today is","post":".","accept":["sunday"],"model":"Sunday"},{"pre":"I can see","post":"blue birds.","accept":["four","4"],"model":"four"},{"pre":"This is a","post":"cup.","accept":["yellow"],"model":"yellow"}],"hints":["看日曆上的星期：SUNDAY；數一數有幾隻鳥。","杯子是什麼顏色？yellow。"]}]};</script>
