<script>window.DAY = {"date":"2026-11-21","no":10,"focus":"今天的重點：看時鐘說幾點十五分、聽標價（eighty 和 eighteen）、How many…?、Are you…?、讀感謝卡找禮物和日子、Can 開頭的問句、用 but 連接。","notes":["聽力第 2 題：eighty（80）和 eighteen（18）聽起來很像，eighty 的重音在前面、eighteen 的重音在後面，可以請 Kyro 拍手打節奏比一比。","閱讀詞彙第 3 題：three birds 是很多隻，要用 There are；只有一個才用 There is。段落填空第 1 格也是同樣的道理：two big lions 要加 s。","寫作第 2 題：一個喜歡、一個不喜歡，意思相反就用 but；可以和家裡的食物一起練：I like ___, but I don't like ___."],"listen":[{"kind":"picaudio","pic":{"type":"clock","h":8,"m":15},"q":"What time is it on this clock?","opts":["It's eight fifty.","It's five fifteen.","It's eight fifteen."],"ans":2,"why":"短針指在 8，長針指在 3，是八點十五分：eight fifteen。eight fifty 是八點五十分，five fifteen 是五點十五分。"},{"kind":"picaudio","pic":{"type":"price","obj":"umbrella","color":"purple","amount":80},"q":"How much is the purple umbrella?","opts":["It's eighteen dollars.","It's eighty dollars.","It's eight dollars."],"ans":1,"why":"標價是 80 元：eighty。eighteen 是 18，eight 是 8。eighty 的重音在前面（EIGH-ty）。"},{"kind":"audioq","talk":[["w","How many brothers do you have, Kyro?"]],"opts":["I have one brother.","He is in the kitchen.","Yes, I do."],"ans":0,"why":"How many 問「幾個」，要回答數量：I have one brother（我有一個哥哥）。"},{"kind":"audioq","talk":[["m","Are you ready for school, Kyro?"]],"opts":["At eight o'clock.","No, it isn't.","Yes, I am."],"ans":2,"why":"Are you 開頭問「你⋯⋯嗎？」，回答用 Yes, I am 或 No, I'm not。it isn't 是在說東西，不是在說自己。"},{"kind":"dialog","talk":[["g","Kyro, my birthday party is on Sunday."],["b","Great! Can I bring a gift?"],["g","Sure. I like books."]],"q":"When is the girl's birthday party?","opts":["On Friday.","On Sunday.","On Monday."],"ans":1,"why":"女孩一開始就說 my birthday party is on Sunday：生日派對在星期天。"},{"kind":"dialog","talk":[["w","Kyro, where is your math book?"],["b","It's in my desk at school, Mom."]],"q":"Where is Kyro's math book?","opts":["In his desk.","On his bed.","Under the chair."],"ans":0,"why":"Kyro 說 It's in my desk at school：數學課本在學校的書桌裡。"},{"kind":"picopts","talk":[["w","Good morning, class. Today is Fun Day. Please go to the park at ten. You can see many birds and frogs there. Bring a hat and some water."]],"q":"What can the class see at the park?","pics":[{"type":"object","obj":"bird","color":"blue"},{"type":"object","obj":"car","color":"red"},{"type":"object","obj":"cake","color":"pink"}],"labels":["小鳥","車子","蛋糕"],"ans":0,"why":"老師的公告說 You can see many birds and frogs there：在公園可以看到很多小鳥和青蛙。"},{"kind":"picopts","talk":[["k","Hi, I am Kane. I am Kyro's brother. I like animals very much. I have a fish at home. It is small and orange. It swims all day."]],"q":"What pet does Kane have?","pics":[{"type":"object","obj":"dog","color":"brown"},{"type":"object","obj":"bird","color":"yellow"},{"type":"object","obj":"fish","color":"orange"}],"labels":["狗","鳥","魚"],"ans":2,"why":"Kane 說 I have a fish at home，小小的、橘色的，整天在游泳：是一條魚。"}],"read":{"vocab":[{"stem":"My kitten is only two weeks old. It is very ____.","opts":["tall","fast","angry","small"],"ans":3,"why":"剛出生兩個星期的小貓很小：small。"},{"stem":"Kyro is sick. Mom takes him to the ____ to see a doctor.","opts":["library","hospital","shape","habitat"],"ans":1,"why":"生病要去醫院看醫生：hospital，是學校 LA 的單字。library 是圖書館。"},{"stem":"There ____ three birds in the tree.","opts":["is","am","are","be"],"ans":2,"why":"three birds 是三隻（很多個），要用 There are。只有一個才用 There is。"}],"cloze":{"passage":"Saturday, November 21. Today I go to the zoo with Mom and Dad. I see two big {1}. They eat meat. Then we eat ice cream. My ice cream is pink. I like {2} very much. It is a happy day!","items":[{"opts":["lion","lions","lionses","a lion"],"ans":1,"why":"two（兩隻）後面的名詞要加 s：two big lions。"},{"opts":["it","they","he","she"],"ans":0,"why":"前一句說的是 my ice cream（一個東西），東西用 it。"}]},"text":{"genre":"card","intro":"讀下面 Kyro 寫給奶奶的感謝卡，回答三個問題。","title":"Thank You, Grandma!","lines":["Dear Grandma,","Thank you for the green bag.","I take it to school every day.","My books and pencils are in it.","Please come to my house on Sunday.","Love, Kyro"],"items":[{"stem":"What is Grandma's gift for Kyro?","opts":["A green bag.","A red ball.","A new book.","A pink cake."],"ans":0,"why":"卡片第二行：Thank you for the green bag，奶奶送的是綠色的包包。"},{"stem":"What is in Kyro's bag?","opts":["Toys and balls.","Apples and eggs.","Hats and cups.","Books and pencils."],"ans":3,"why":"My books and pencils are in it：包包裡是書和鉛筆。"},{"stem":"When can Grandma come to Kyro's house?","opts":["On Monday.","On Friday.","On Sunday.","On Tuesday."],"ans":2,"why":"Please come to my house on Sunday：請奶奶星期天來家裡。"}]}},"write":[{"kind":"rewrite","instr":"改成問句（⋯⋯嗎？）。","prompt":"Kane can ride a bike.","needQ":true,"accept":["can kane ride a bike"],"model":"Can Kane ride a bike?","near":[["^kane can ride","問句要把 Can 搬到最前面：Can Kane ...?"],["^(do|does) kane","有 can 的句子，把 can 搬到前面就好，不用 do/does。"],["^can kane rides","can 後面的動詞不加 s：ride。"]],"hints":["把 can 搬到句子最前面，第一個字母要大寫。","Can Kane ___ a bike?"]},{"kind":"combine","instr":"用 but 把兩個句子合成一句。","prompt":["I like apples.","I don't like bananas."],"word":"but","needQ":false,"accept":["i like apples but i don't like bananas","i like apples but i do not like bananas","i like apples but don't like bananas"],"model":"I like apples, but I don't like bananas.","near":[["\\band\\b","一個喜歡、一個不喜歡，意思相反，用 but，不是 and。"],["\\bor\\b","意思相反用 but，不是 or。"],["^i like apples i don't","兩句中間要加 but。"]],"hints":["兩句意思相反（喜歡／不喜歡），中間用 but。","I like apples, ___ I don't like bananas."]},{"kind":"order","instr":"依照順序點字卡，排成一句話。","words":["park.","likes","My","the","dog"],"ans":"My dog likes the park.","hints":["大寫字母開頭的字放第一個，有句點的字放最後。","My dog ..."]},{"kind":"picture","instr":"看三張圖，把句子寫完。","panels":[{"type":"weather","w":"snowy"},{"type":"price","obj":"book","color":"blue","amount":30},{"type":"position","obj":"ball","color":"red","rel":"in","ref":"box"}],"lines":[{"pre":"It is","post":"today.","accept":["snowy"],"model":"snowy"},{"pre":"The blue book is","post":"dollars.","accept":["thirty","30"],"model":"thirty"},{"pre":"The red ball is","post":"the box.","accept":["in"],"model":"in"}],"hints":["第一張圖在下雪：snowy；書的標價是 30：thirty。","球在箱子的裡面：in。"]}]};</script>
